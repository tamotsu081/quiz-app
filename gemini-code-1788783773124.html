    ["5-2", "地域の実情に応じて、高齢者が可能な限り住み慣れた地域で能力に応じ自立した日常生活を営むことが出来るよう、医療・介護・介護予防・住まい及び自立した日常生活の支援が確立される体制を地域包括ケアシステムという。[cite: 1, 2]", "地域の実情に応じて、高齢者が可能な限り住み慣れた地域で能力に応じ自立した日常生活を営むことが出来るよう、医療・介護・介護予防・住まい及び自立した日常生活の支援が確立される体制を高齢者複合型サービスシステムという。[cite: 1, 2]"],
    ["5-3", "地域包括支援センターの主な設置主体は市町村等自治体で、管理者に職種の規定はないが、保健師又は地域ケアに経験のある看護師、社会福祉士、主任ケアマネージャー等が置かれる。[cite: 1, 2]", "地域包括支援センターの主な設置主体は民間事業者で、管理者に職種の規定はないが、医師、作業療法士等が置かれる。[cite: 1, 2]"],
    ["5-4", "地域包括支援センターの主な4つの機能とは介護予防マネジメント、総合相談・支援、権利擁護事業、包括的・継続的マネジメントである。[cite: 1, 2]", "地域包括支援センターの主な4つの機能とは適正栄養事業、生活支援費給付事業等である。[cite: 1, 2]"],
    ["5-5", "JCHOとは独立行政法人地域医療機能推進機構のことである。またAMEDとは国立研究開発法人日本医療研究開発機構のことである。[cite: 1, 2]", "JCHOとは独立行政法人国立病院機構のことである。またAMEDとは国立研究開発法人国立国際医療研究センターのことである。[cite: 1, 2]"],
    ["5-6", "臓器の移植に関する法律で規定する臓器は、心臓、肺、肝臓、膵臓、眼球の他、腎臓、小腸が規定されている。[cite: 1, 2]", "臓器の移植に関する法律で規定する臓器は、心臓、肺、肝臓、膵臓、眼球の他、大腸、骨髄が規定されている。[cite: 1, 2]"],
    ["5-7", "臓器移植は15歳未満の者から移植することができる。[cite: 1, 2]", "臓器移植は15歳未満の者から移植することができない。[cite: 1, 2]"],
    ["5-8", "わが国では、一般に人の死は呼吸の停止、脈拍の停止、瞳孔散大を基礎として総合的に判定している。[cite: 1, 2]", "わが国では、一般に人の死は腱反射消失を基礎として総合的に判定している。[cite: 1, 2]"],
    ["5-9", "脳死した者の身体とは、脳幹を含む全脳の機能が不可逆的に停止するに至ったと判定された者の身体をいう。[cite: 1, 2]", "脳死した者の身体とは、脳幹を含む半数以上の脳の機能が可逆的に停止するに至ったと判定された者の身体をいう。[cite: 1, 2]"],
    ["5-10", "移植に係る脳死判定は深昏睡、瞳孔固定4mm以上、脳幹反射消失、平坦脳波、自発呼吸の消失等の確認が必要である。[cite: 1, 2]", "移植に係る脳死判定は脈拍停止、発汗消失等の確認が必要である。[cite: 1, 2]"],
    ["5-11", "成人に対するこの脳死判定は臓器の摘出及び移植に関与しない医師の2名の医師の判断の一致によって行われ、通常6時間以上を経て2回行わなければならない。[cite: 1, 2]", "成人に対するこの脳死判定は臓器を摘出する医師の2名の医師の判断の一致によって行われ、通常12時間を経て2回行わなければならない。[cite: 1, 2]"],
    ["5-12", "患者が提供の意思がある旨の書面があるが、遺族が拒む場合、臓器移植は提供不可である。また遺族がない場合は提供可である。[cite: 1, 2]", "患者が提供の意思がある旨の書面があるが、遺族が拒む場合、臓器移植は提供可である。また遺族がない場合は提供不可である。[cite: 1, 2]"],
    ["5-13", "患者が提供の意思が不明の場合、遺族が書面で承諾した場合、臓器移植は提供可である。[cite: 1, 2]", "患者が提供の意思が不明の場合、遺族が書面で承諾した場合、臓器移植は提供不可である。[cite: 1, 2]"],
    ["5-14", "臓器斡旋（あっせん）機関は厚生労働大臣の許可を受けなければならない。[cite: 1, 2]", "臓器斡旋（あっせん）機関は都道府県知事の許可を受けなければならない。[cite: 1, 2]"],
    ["5-15", "「移植に用いる造血幹細胞の適切な提供の推進に関する法律」で規定する造血幹細胞は骨髄、末梢血幹細胞、臍帯血である。[cite: 1, 2]", "「移植に用いる造血幹細胞の適切な提供の推進に関する法律」で規定する造血幹細胞はiPS細胞、受精卵である。[cite: 1, 2]"],
    ["5-16", "人工多能性幹細胞（iPS細胞など）を用いる医療技術は第1種再生医療等である。[cite: 1, 2]", "人工多能性幹細胞（iPS細胞など）を用いる医療技術は第2種再生医療等である。[cite: 1, 2]"],
    ["5-17", "死産とは妊娠4カ月以後における死児の出産で、死児とは、出産後において心臓拍動、随意筋の運動及び呼吸のいずれをも認めないものをいう。[cite: 1, 2]", "死産とは妊娠6ヶ月以後における死児の出産で、死児とは、出産後において心臓拍動、随意筋の運動及び呼吸のいずれかを認めないものをいう。[cite: 1, 2]"],
    ["5-18", "死産の届出は医師または助産師の死産証書または死胎検案書を添えて、7日以内に市町村長もしくは区長に提出しなければならない。[cite: 1, 2]", "死産の届出は医師または助産師の死産証書または死胎検案書を添えて、5日以内に保健所長に提出しなければならない。[cite: 1, 2]"],
    ["5-19", "病因の解明のために行う解剖を病理解剖という。[cite: 1, 2]", "病因の解明のために行う解剖を正常解剖という。[cite: 1, 2]"],
    ["5-20", "死体の解剖を行う場合、解剖学・病理学・法医学の教授や准教授が行う場合等、一定の場合を除いて、保健所長の許可を受けなければならない。[cite: 1, 2]", "死体の解剖を行う場合、解剖学・病理学・法医学の教授や准教授が行う場合等、一定の場合を除いて、厚生労働大臣の許可を受けなければならない。[cite: 1, 2]"],
    ["5-21", "都道府県において災害拠点病院について指定する。基本的に、地域災害拠点病院は原則として、2次医療圏ごとに1か所整備することとしている。[cite: 1, 2]", "都道府県において災害拠点病院について指定する。基本的に、地域災害拠点病院は原則として、1次医療圏ごとに1か所整備することとしている。[cite: 1, 2]"],
    ["5-22", "災害医療に関係するDMATとは災害派遣医療チームの事であるがDPATとは災害派遣精神医療チームの事である。またDHEATとは健康危機管理チームの事である。[cite: 1, 2]", "災害医療に関係するDMATとは災害派遣医療チームの事であるがDPATとは災害派遣福祉チームの事である。またDHEATとは熱傷災害派遣医療チームの事である。[cite: 1, 2]"],
    ["5-23", "都道府県が災害拠点病院を指定する。原則として、地域災害拠点病院を2次医療圏ごとに1か所、基幹災害拠点病院を都道府県に1か所指定する。[cite: 1, 2]", "国が災害拠点病院を指定する。原則として、地域災害拠点病院を市町村ごとに1か所、中央災害拠点病院を都道府県に1か所指定する。[cite: 1, 2]"],
    ["5-24", "地域保健法は保健所、市町村保健センターの設置や運営について規定したものである。[cite: 1, 2]", "地域保健法は地域介護施設、精神保健福祉センターの設置や運営について規定したものである。[cite: 1, 2]"],
    ["5-25", "保健所は都道府県、指定都市、特別区等が設置する。[cite: 1, 2]", "保健所は国等が設置する。[cite: 1, 2]"],
    ["5-26", "保健所の事業には人口動態統計、食品衛生、感染症の予防対策、精神保健に関する事項、難病の保健に関する事項を行う他、地域の地域保健に関する調査研究等を行うことが出来る。[cite: 1, 2]", "保健所の事業には人口動態統計、食品衛生、感染症の予防対策、介護保険の認定に関する事項を行う他、地域の地域保健に関する調査研究等を行うことが出来る。[cite: 1, 2]"],
    ["5-27", "保健師、看護師、助産師、歯科衛生士はその業務に関して就業地を管轄する保健所の長の指示を受けたときは、基本的にこれに従わなければならない。[cite: 1, 2]", "栄養士はその業務に関して就業地を管轄する保健所の長の指示を受けたときは、基本的にこれに従わなければならない。[cite: 1, 2]"],
    ["5-28", "市町村は、住民の健康相談、保健指導、健康診査などを行う拠点として、市町村保健センターを設置することが出来る。[cite: 1, 2]", "市町村は、住民の健康相談、保健指導、健康診査などを行う拠点として、市町村健康福祉センターを設置することが出来る。[cite: 1, 2]"],
    ["5-29", "健康増進法では受動喫煙防止、特別用途表示食品、国民健康・栄養調査等の施策がある。[cite: 1, 2]", "健康増進法ではアレルギー表示等の施策がある。[cite: 1, 2]"],
    ["5-30", "都道府県は健康増進計画を定める。また厚生労働大臣は健康増進事業実施者が守るべき健康診査等指針を定める。[cite: 1, 2]", "厚生労働大臣は健康増進計画を定める。また都道府県は健康増進事業実施者が守るべき健康診査等指針を定める。[cite: 1, 2]"],
    ["5-31", "特定給食施設とは、継続的に1回100食以上又は1日250食以上の食事を供給する施設とされている。[cite: 1, 2]", "特定給食施設とは、継続的に1回50食以上又は1日300食以上の食事を供給する施設とされている。[cite: 1, 2]"],
    ["5-32", "特定かつ多数に継続的に食事を供給する施設のうち、栄養管理が必要として省令で定める特定給食施設の設置者は都道府県知事に届け出なければならない。[cite: 1, 2]", "特定かつ限られた者に継続的に食事を供給する施設のうち、栄養管理が必要として省令で定める特定給食施設の設置者は厚生労働大臣に届け出なければならない。[cite: 1, 2]"],
    ["5-33", "特定給食施設であって特別の栄養管理が必要なものとして厚生労働省令で定めるところにより都道府県知事が指定するものの設置者は、当該特定給食施設に管理栄養士を置かなければならない。[cite: 1, 2]", "特定給食施設であって特別の栄養管理が必要なものとして厚生労働省令で定めるところにより都道府県知事が指定するものの設置者は、当該特定給食施設に栄養士を置かなければならない。[cite: 1, 2]"],
    ["5-34", "受動喫煙防止に関する健康増進法の規定により第1種施設である学校や病院では特定屋外喫煙場所、喫煙関連研究場所以外の場所で喫煙してはならない。[cite: 1, 2]", "受動喫煙防止に関する健康増進法の規定により第2種施設である学校や病院では特定屋外喫煙場所、喫煙関連研究場所以外の場所で喫煙してはならない。[cite: 1, 2]"],
    ["6-1", "精神保健及び精神障害者福祉に関する法律は、精神衛生法が昭和25年に制定されてから数回の改正を経て、精神障害者の自立と社会経済活動への参加の促進を図るため、大幅に改正され現在の名称となり、更に種々の改正が進み現在に至っている。[cite: 1, 2]", "精神保健及び精神障害者福祉に関する法律は、精神保健法が昭和25年に制定されてから数回の改正を経て、精神障害者の自立と社会経済活動への参加の促進を図るため、大幅に改正され現在の名称となり、更に種々の改正が進み現在に至っている。[cite: 1, 2]"],
    ["6-2", "都道府県は精神保健の向上と精神障害者の福祉の増進を図るため精神保健福祉センターを設置する。センターでは調査研究、精神障害者保健福祉手帳の交付決定、精神医療審査会の事務等を行う。[cite: 1, 2]", "国は精神保健の向上と精神障害者の福祉の増進を図るため精神保健福祉センターを設置する。センターでは調査研究、精神障害者保健福祉手帳の交付決定、通院医療公費負担申請の審査等を行う。[cite: 1, 2]"],
    ["6-3", "精神保健指定医は、厚生労働大臣が必要な知識及び技能を有すると認める場合指定する。指定後5年ごとに厚生労働省令で定める研修を受けなければ更新できない。[cite: 1, 2]", "精神保健指定医は、都道府県知事が必要な知識及び技能を有すると認める場合指定する。指定後3年ごとに厚生労働省令で定める研修を受けなければ更新できない。[cite: 1, 2]"],
    ["6-4", "医療保護入院、応急入院の際には、精神保健指定医の診察が必要である。[cite: 1, 2]", "任意入院の際には、精神保健指定医の診察が必要である。[cite: 1, 2]"],
    ["6-5", "任意入院の場合、入院者から退院の申し出があった場合は、基本的には退院させなければならない。任意入院患者からの退院の申し出があっても、指定医が入院継続の必要があると認めたときは72時間以内は退院させないことができる。[cite: 1, 2]", "任意入院の場合、入院者から退院の申し出があった場合は、基本的には退院させることはできない。任意入院患者からの退院の申し出があっても、指定医が入院継続の必要があると認めたときは48時間以内は退院させないことができる。[cite: 1, 2]"],
    ["6-6", "医療保護入院は精神保健指定医の診察の結果入院の必要があると認められるが、本人の同意がなく、家族等の同意があることにより入院させる場合をいう。[cite: 1, 2]", "医療保護入院は精神保健指定医の診察の結果入院の必要があると認められるが、本人の同意がなく、都道府県知事の同意があることにより入院させる場合をいう。[cite: 1, 2]"],
    ["6-7", "都道府県知事は、2人以上の精神保健指定医の診察の結果、一致した意見として、受診者が精神障害者であり、自傷他害の恐れがあると認めたとき、国・都道府県の精神科病院または指定病院に入院させることが出来るが、これを措置入院という。[cite: 1, 2]", "厚生労働大臣は、1人以上の精神保健指定医の診察の結果、一致した意見として、受診者が精神障害者であり、自傷他害の恐れがあると認めたとき、国・都道府県の精神科病院または指定病院に入院させることが出来るが、これを措置入院という。[cite: 1, 2]"],
    ["6-8", "緊急措置入院とは、都道府県知事が、自傷他害の恐れが著しく急を要する場合、1人の精神保健指定医の診察により72時間に限り入院させることが出来るものである。[cite: 1, 2]", "緊急措置入院とは、厚生労働大臣が、自傷他害の恐れが著しく急を要する場合、2人の精神保健指定医の診察により48時間に限り入院させることが出来るものである。[cite: 1, 2]"],
    ["6-9", "精神保健指定医が必要と認めた場合、入院患者の隔離、身体拘束はできるが、入院患者の代理人である弁護士との面会等の制限はできない。[cite: 1, 2]", "精神保健指定医が必要と認めた場合、入院患者の隔離、信書の発受の制限はできるが、入院患者の代理人である弁護士との面会等の制限はできない。[cite: 1, 2]"],
    ["6-10", "12時間未満の患者の隔離は精神保健指定医以外の医師の判断で出来る。[cite: 1, 2]", "12時間未満の患者の隔離は看護師の判断で出来る。[cite: 1, 2]"],
    ["6-11", "隔離や身体拘束を行った場合、その理由、開始日時、解除日時を診療録に記載しなければならない。[cite: 1, 2]", "隔離や身体拘束を行った場合でも、その理由、開始日時、解除日時を診療録に記載する義務はない。[cite: 1, 2]"],
    ["6-12", "精神障害者であり指定医の診察の結果、直ちに入院が必要な者について、家族の同意があるとき、都道府県知事は応急入院指定病院に移送することができる。[cite: 1, 2]", "精神障害者であり指定医の診察の結果、直ちに入院が必要な者について、家族の同意があるとき、警察署長は応急入院指定病院に移送することができる。[cite: 1, 2]"],
    ["6-13", "患者の家族は病院の処遇の改善をもとめるため、都道府県知事に請求することが出来る。これを受け都道府県知事は精神医療審査会の審査を求め対応する。[cite: 1, 2]", "患者の家族は病院の処遇の改善をもとめるため、都道府県知事に請求することが出来る。これを受け都道府県知事は精神保健福祉審議会の審査を求め対応する。[cite: 1, 2]"],
    ["6-14", "都道府県知事は必要があるときは2人以上の精神保健指定医に診察させ、入院継続の意見が一致しない場合、その精神科病院の管理者に対し、退院を命ずることができる。[cite: 1, 2]", "厚生労働大臣は必要があるときは3人以上の精神保健指定医に診察させ、入院継続の意見が一致しない場合、その精神科病院の指定医に対し、退院を命ずることができる。[cite: 1, 2]"],
    ["6-15", "措置入院者を入院させている精神科病院の管理者は、退院後生活環境相談員を選任し、その者に退院後の生活環境に関し、措置入院者及びその家族等からの相談に応じさせ、及び必要な情報の提供、助言その他の援助を行わせなければならない。当該相談員は精神保健福祉士や、精神障害者に関する業務の経験のある看護師（または社会福祉士）等がなることが出来る。[cite: 1, 2]", "措置入院者を入院させている精神科病院の管理者は、自立支援相談員を選任し、その者に退院後の生活環境に関し、措置入院者及びその家族等からの相談に応じさせ、及び必要な情報の提供、助言その他の援助を行わせなければならない。[cite: 1, 2]"],
    ["6-16", "精神障害者は都道府県知事に精神障害者保健福祉手帳の交付を申請することが出来る。交付を受けた場合、2年ごとに精神障害の状態について認定を受けなければならない。また手帳の交付により税金の免除や控除、公共料金等の割引等を受けることができる。[cite: 1, 2]", "精神障害者は都道府県知事に精神障害者保健福祉手帳の交付を申請することが出来る。交付を受けた場合、毎年精神障害の状態について認定を受けなければならない。[cite: 1, 2]"],

let score = 0;
let totalAnswered = 0;
const totalQuestions = questionsData.length; // 150

// 法則性を持たせず、ちょうど半数を〇、半数を✖にするためにシャッフルした真偽値配列を生成
let trueFalseArray = [];
for(let i=0; i<totalQuestions; i++) {
    trueFalseArray.push(i < totalQuestions / 2);
}
// 配列をシャッフル (Fisher-Yates)
for (let i = trueFalseArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [trueFalseArray[i], trueFalseArray[j]] = [trueFalseArray[j], trueFalseArray[i]];
}

const quizContainer = document.getElementById('quiz-container');
const scoreStatus = document.getElementById('score-status');

questionsData.forEach((q, index) => {
    const qNum = q[0];
    const correctText = q[1];
    const wrongText = q[2];
    
    // この問題の正解が「〇 (true)」か「✖ (false)」かを判定
    const isCorrectStatement = trueFalseArray[index];
    const displayText = isCorrectStatement ? correctText : wrongText;
    
    const card = document.createElement('div');
    card.className = 'question-card';
    
    card.innerHTML = `
        <div class="question-header">問題 ${qNum}</div>
        <div class="question-text">${displayText}</div>
        <div class="btn-group">
            <button class="btn btn-true" onclick="checkAnswer(${index}, true, this)">〇 正しい</button>
            <button class="btn btn-false" onclick="checkAnswer(${index}, false, this)">✖ 誤り</button>
        </div>
        <div class="result" id="result-${index}"></div>
        <div class="explanation" id="expl-${index}" style="display: none;">
            <strong>【本来の正しい文章（解説）】</strong><br>
            ${correctText}
        </div>
    `;
    quizContainer.appendChild(card);
});

function checkAnswer(index, userChoice, btn) {
    const isCorrectStatement = trueFalseArray[index]; // この問題文が本当に正しいか
    const q = questionsData[index];
    
    const resultDiv = document.getElementById(`result-${index}`);
    const explDiv = document.getElementById(`expl-${index}`);
    
    const isUserCorrect = (userChoice === isCorrectStatement);
    
    if (isUserCorrect) {
        resultDiv.textContent = "正解！";
        resultDiv.className = "result correct";
        score++;
    } else {
        resultDiv.textContent = "不正解...";
        resultDiv.className = "result incorrect";
    }
    
    // 正解が「✖（誤り）」のパターンの場合、解説として元の正しい文章を表示
    if (!isCorrectStatement) {
        explDiv.style.display = "block";
    }
    
    // ボタンを無効化
    const btns = btn.parentElement.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);
    
    totalAnswered++;
    updateScore();
}

function updateScore() {
    scoreStatus.textContent = `正解数: ${score} / ${totalAnswered} (全 ${totalQuestions} 問中)`;
}
</script>
