// アプリケーション状態管理
let currentIndex = 0;

function renderQuestion() {
    const q = questionsData[currentIndex];
    document.getElementById('progress-text').innerText = `問題 ${currentIndex + 1} / ${questionsData.length} (ID: ${q.id})`;
    
    // 空欄のスロットをレンダリング[cite: 1, 2]
    let formattedText = q.text;
    q.blanks.forEach((b, idx) => {
        const val = b.selected ? b.selected : `[空欄 ${idx + 1}]`;
        const cls = b.selected ? 'blank-slot filled' : 'blank-slot';
        const slotHtml = `<span class="${cls}" id="slot-${idx}">${val}</span>`;
        formattedText = formattedText.replace(`{${idx}}`, slotHtml);
    });
    
    document.getElementById('question-container').innerHTML = `${q.id}. ${formattedText}`;
    
    // 選択肢の表示
    const optsContainer = document.getElementById('options-container');
    optsContainer.innerHTML = '';
    
    q.blanks.forEach((blank, bIdx) => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'blank-group';
        groupDiv.innerHTML = `<div class="blank-label">[空欄 ${bIdx + 1}] の選択肢</div>`;
        
        blank.options.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            if (blank.selected === opt) {
                btn.classList.add('selected');
            }
            btn.innerText = opt;
            btn.onclick = () => selectOption(bIdx, opt);
            groupDiv.appendChild(btn);
        });
        optsContainer.appendChild(groupDiv);
    });
    
    document.getElementById('check-btn').disabled = !q.blanks.every(b => b.selected);
    document.getElementById('check-btn').style.display = 'inline-block';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('result-msg').innerHTML = '';
}

function selectOption(bIdx, optText) {
    const q = questionsData[currentIndex];
    q.blanks[bIdx].selected = optText;
    
    // スロットの表示を更新
    const slot = document.getElementById(`slot-${bIdx}`);
    if (slot) {
        slot.innerText = optText;
        slot.className = 'blank-slot filled';
    }
    
    // ボタンの選択状態を更新
    const groupDiv = document.getElementById('options-container').children[bIdx];
    Array.from(groupDiv.getElementsByClassName('option-btn')).forEach(btn => {
        if (btn.innerText === optText) {
            btn.classList.add('selected');
        } else {
            btn.classList.remove('selected');
        }
    });
    
    // 全て選択されたか確認
    document.getElementById('check-btn').disabled = !q.blanks.every(b => b.selected);
}

function checkAnswer() {
    const q = questionsData[currentIndex];
    let allCorrect = true;
    
    q.blanks.forEach((blank, bIdx) => {
        const groupDiv = document.getElementById('options-container').children[bIdx];
        const btns = Array.from(groupDiv.getElementsByClassName('option-btn'));
        const slot = document.getElementById(`slot-${bIdx}`);
        
        const isCorrect = (blank.selected === blank.answer);
        if (!isCorrect) allCorrect = false;
        
        if (slot) {
            slot.className = `blank-slot ${isCorrect ? 'correct' : 'wrong'}`;
        }
        
        btns.forEach(btn => {
            if (btn.innerText === blank.answer) {
                btn.classList.add('correct');
            } else if (btn.innerText === blank.selected && !isCorrect) {
                btn.classList.add('wrong');
            }
            btn.disabled = true;
        });
    });
    
    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'inline-block';
    
    const resMsg = document.getElementById('result-msg');
    if (allCorrect) {
        resMsg.innerHTML = '<span style="color:#2ecc71;">正解です！よくできました。</span>[cite: 1]';
    } else {
        resMsg.innerHTML = '<span style="color:#e74c3c;">不正解が含まれています。緑色の正答を確認してください。</span>[cite: 1]';
    }
}

function nextQuestion() {
    if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        document.getElementById('quiz-app').innerHTML = `<div class="question-card" style="text-align:center;"><strong>すべての問題が終了しました！お疲れ様でした。</strong></div>`;
    }
}

// 初期起動
window.onload = () => {
    renderQuestion();
};
</script>
