let currentIndex = 0;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById("progress").textContent = `問題 ${currentIndex + 1} / ${questions.length}`;
    
    let htmlText = q.text;
    
    if (q.type === "ordered") {
        q.holes.forEach((hole, index) => {
            let selectHtml = `<select id="hole-${index}"><option value="">選択してください</option>`;
            let opts = shuffle([...hole.options]);
            opts.forEach(opt => {
                selectHtml += `<option value="${opt}">${opt}</option>`;
            });
            selectHtml += `</select>`;
            htmlText = htmlText.replace(`{${index}}`, selectHtml);
        });
    } else if (q.type === "unordered") {
        let opts = shuffle([...q.options]);
        q.corrects.forEach((correct, index) => {
            let selectHtml = `<select id="hole-${index}"><option value="">選択してください</option>`;
            opts.forEach(opt => {
                selectHtml += `<option value="${opt}">${opt}</option>`;
            });
            selectHtml += `</select>`;
            htmlText = htmlText.replace(`{${index}}`, selectHtml);
        });
    }
    
    document.getElementById("question-text").innerHTML = htmlText;
    
    // Reset UI
    document.getElementById("result-area").style.display = "none";
    document.getElementById("submit-btn").style.display = "inline-block";
    document.getElementById("next-btn").style.display = "none";
}

function checkAnswer() {
    const q = questions[currentIndex];
    let isCorrect = true;
    let numHoles = q.type === "ordered" ? q.holes.length : q.corrects.length;
    let userAnswers = [];
    
    // Validate all selected
    for(let i=0; i<numHoles; i++) {
        let val = document.getElementById(`hole-${i}`).value;
        if(!val) {
            alert("すべての空欄を選択してください。");
            return;
        }
        userAnswers.push(val);
    }
    
    let correctAnswersText = "";

    if (q.type === "ordered") {
        for(let i=0; i<numHoles; i++) {
            if(userAnswers[i] !== q.holes[i].correct) {
                isCorrect = false;
            }
        }
        correctAnswersText = q.holes.map(h => h.correct).join("、");
    } else if (q.type === "unordered") {
        let sortedUser = [...userAnswers].sort();
        let sortedCorrect = [...q.corrects].sort();
        
        // 順不同の場合は、選んだ要素が重複していないか（同じものを2つ選んでいないか）チェック
        let uniqueUserAnswers = new Set(userAnswers);
        if(uniqueUserAnswers.size !== userAnswers.length) {
            isCorrect = false;
        } else {
            for(let i=0; i<sortedUser.length; i++) {
                if(sortedUser[i] !== sortedCorrect[i]) isCorrect = false;
            }
        }
        correctAnswersText = q.corrects.join("、");
    }

    const resultArea = document.getElementById("result-area");
    const resultMessage = document.getElementById("result-message");
    const correctAnswerDiv = document.getElementById("correct-answer");
    
    resultArea.style.display = "block";
    resultArea.className = isCorrect ? "correct" : "incorrect";
    
    if(isCorrect) {
        resultMessage.innerHTML = "<h3>⭕ 正解！</h3>";
        correctAnswerDiv.innerHTML = "";
    } else {
        resultMessage.innerHTML = "<h3>❌ 不正解...</h3>";
        correctAnswerDiv.innerHTML = `正解は <strong>${correctAnswersText}</strong> です。`;
    }
    
    document.getElementById("submit-btn").style.display = "none";
    
    if (currentIndex < questions.length - 1) {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("next-btn").textContent = "次の問題へ";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("next-btn").textContent = "最初からやり直す";
    }
    
    // 選択肢をロックする
    for(let i=0; i<numHoles; i++) {
        document.getElementById(`hole-${i}`).disabled = true;
    }
}

function nextQuestion() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
    } else {
        currentIndex = 0; // Reset
    }
    loadQuestion();
}

// 初期読み込み
window.onload = loadQuestion;
