(措置入院) 精神障害者でありかつ(自傷他害)の恐れがある。(知事命令による行政処分)。(精神保健指定医2名以上)
(緊急措置入院) 精神障害者でありかつ自傷他害の恐れがあり、(直ちに)入院が必要。(知事命令による行政処分)。(精神保健指定医1名以上)`;

// 状態管理
let questions = [];
let currentIndex = 0;
let correctTotalCount = 0;
let isAnswerChecked = false; // 現在の問題が判定済みかどうか

// 初期化処理：テキストから問題リストを生成
function initQuiz() {
    questions = [];
    currentIndex = 0;
    correctTotalCount = 0;
    isAnswerChecked = false;

    // 正規表現: ()で囲まれた部分を抽出（ネストされた括弧にも対応）
    const regex = /\(([^()]+(?:\([^()]+\)[^()]*)*)\)/g;
    const lines = rawText.split('\n');

    lines.forEach(line => {
        // 穴埋めがある行だけを問題として抽出
        if (regex.test(line)) {
            let answers = [];
            let htmlText = line.replace(regex, (match, p1) => {
                answers.push(p1.trim());
                // インデックスを振ってIDを管理
                return `<input type="text" class="quiz-input" data-index="${answers.length - 1}">`;
            });
            
            questions.push({
                originalText: line,
                htmlText: htmlText,
                answers: answers
            });
        }
    });

    document.getElementById('score-display').innerText = `正解数: 0`;
    document.getElementById('reset-btn').style.display = 'none';
    
    displayQuestion();
}

// 現在の問題を画面に表示
function displayQuestion() {
    if (currentIndex >= questions.length) {
        showResult();
        return;
    }

    const q = questions[currentIndex];
    
    document.getElementById('progress').innerText = `問題: ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerHTML = q.htmlText;
    document.getElementById('feedback').innerText = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('answer-display').style.display = 'none';
    document.getElementById('answer-display').innerHTML = '';

    document.getElementById('check-btn').style.display = 'inline-block';
    document.getElementById('next-btn').style.display = 'none';

    isAnswerChecked = false;
    
    // 最初の入力欄にフォーカス
    const inputs = document.querySelectorAll('.quiz-input');
    if (inputs.length > 0) {
        inputs[0].focus();
    }
}

// 正誤判定処理
function checkAnswer() {
    if (isAnswerChecked) return; // 既に判定済みの場合は何もしない
    
    const q = questions[currentIndex];
    const inputs = document.querySelectorAll('.quiz-input');
    let allCorrect = true;
    let answerHtml = '<strong>正解:</strong><ul>';

    inputs.forEach((input) => {
        const index = parseInt(input.getAttribute('data-index'));
        const userAnswer = input.value.trim();
        const correctAnswer = q.answers[index];
        
        answerHtml += `<li>(${correctAnswer})</li>`;

        input.disabled = true; // 判定後は入力不可にする

        if (userAnswer === correctAnswer) {
            input.classList.add('correct');
        } else {
            input.classList.add('incorrect');
            allCorrect = false;
        }
    });
    
    answerHtml += '</ul>';
    
    const feedbackEl = document.getElementById('feedback');
    if (allCorrect) {
        feedbackEl.innerText = "正解！";
        feedbackEl.className = 'feedback correct-msg';
        correctTotalCount++;
        document.getElementById('score-display').innerText = `正解数: ${correctTotalCount}`;
    } else {
        feedbackEl.innerText = "不正解...";
        feedbackEl.className = 'feedback incorrect-msg';
        
        // 不正解があった場合のみ正解リストを表示する
        const answerDisplay = document.getElementById('answer-display');
        answerDisplay.innerHTML = answerHtml;
        answerDisplay.style.display = 'block';
    }

    isAnswerChecked = true;
    
    // ボタンの切り替え
    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').focus(); // 次へボタンにフォーカスを移動
}

// 次の問題へ進む
function nextQuestion() {
    if (!isAnswerChecked) return;
    currentIndex++;
    displayQuestion();
}

// 全て終わった後の結果表示
function showResult() {
    document.getElementById('progress').innerText = '終了！';
    document.getElementById('question-text').innerHTML = `
        <div style="text-align: center; font-size: 1.5em; margin-top: 20px;">
            全 ${questions.length} 問中、<br>
            <span style="color: #e74c3c; font-size: 1.5em; font-weight: bold;">${correctTotalCount}</span> 問 正解しました！
        </div>
    `;
    document.getElementById('feedback').innerText = '';
    document.getElementById('answer-display').style.display = 'none';
    
    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'inline-block';
}

// Enterキーの制御 (入力欄では判定、判定後は次へ)
document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        if (!isAnswerChecked) {
            checkAnswer();
        } else {
            if (currentIndex < questions.length) {
                nextQuestion();
            }
        }
    }
});

// ページ読み込み時にクイズ開始
window.onload = initQuiz;

</script>
