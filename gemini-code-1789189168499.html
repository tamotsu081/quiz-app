<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肝機能障害のある人の看護 ドリル</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-width: 800px;
        width: 100%;
        padding: 30px;
        box-sizing: border-box;
    }
    h1 {
        font-size: 1.5rem;
        color: #2c3e50;
        text-align: center;
        border-bottom: 2px solid #16a085;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .progress {
        font-weight: bold;
        color: #7f8c8d;
        margin-bottom: 15px;
    }
    .question-text {
        font-size: 1.2rem;
        margin-bottom: 25px;
        line-height: 2;
    }
    select {
        font-size: 1rem;
        padding: 5px;
        margin: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        background-color: #f9f9f9;
        cursor: pointer;
        max-width: 100%;
    }
    select:focus {
        outline: none;
        border-color: #16a085;
        background-color: #e8f8f5;
    }
    .btn {
        display: inline-block;
        background-color: #16a085;
        color: #fff;
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn:hover {
        background-color: #1abc9c;
    }
    .btn:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
    }
    #result-area {
        margin-top: 20px;
        padding: 15px;
        border-radius: 5px;
        display: none;
    }
    .correct {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .incorrect {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .answer-text {
        font-weight: bold;
        margin-top: 10px;
    }
    .next-btn-container {
        margin-top: 20px;
        text-align: right;
    }
    .citation {
        font-size: 0.8rem;
        color: #95a5a6;
    }
</style>
</head>
<body>

<div class="container">
    <h1>肝機能障害のある人の看護 ドリル</h1>
    <div class="progress" id="progress">問題 1 / 21</div>
    <div class="question-text" id="question-text"></div>
    
    <button class="btn" id="submit-btn" onclick="checkAnswer()">解答する</button>
    
    <div id="result-area">
        <div id="result-message"></div>
        <div id="correct-answer" class="answer-text"></div>
        <div class="next-btn-container">
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">次の問題へ</button>
        </div>
    </div>
</div>

<script>
const questions = [
    {
        text: "肝機能が低下すると、タンパク質合成能が低下する。低アルブミン血症⇒ {0} ・ {1} 、血液凝固因子の減少による出血傾向などの症状が現れる。<span class='citation'>[cite: 6]</span>",
        type: "unordered",
        corrects: ["浮腫", "腹水"],

    {

            { correct: "600", options: ["200", "400", "600", "800"] },

    {

        type: "ordered",
        holes: [
            { correct: "低アルブミン血症", options: ["低アルブミン血症", "高ナトリウム血症", "低カルシウム血症", "高アンモニア血症"] },
            { correct: "門脈圧亢進", options: ["門脈圧亢進", "肝動脈圧低下", "中心静脈圧上昇", "肺動脈圧亢進"] }
        ]
    },
    {

        type: "ordered",
        holes: [
            { correct: "アンモニア", options: ["アンモニア", "ウロビリノーゲン", "胆汁酸", "尿素"] },
            { correct: "肝性脳症", options: ["肝性脳症", "肝腎症候群", "ウエルニッケ脳症", "劇症肝炎"] }
        ]
    },
    {
        text: "代償性肝硬変の食事：塩分は {0} g/日以下を目標とする。（腹水、 {1} 予防）<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [
            { correct: "6", options: ["3", "5", "6", "8"] },
            { correct: "浮腫", options: ["浮腫", "脱水", "腹水", "高血圧"] }
        ]
    },
    {
        text: "非代償性肝硬変の食事：肝性脳症出現時、昏睡時は {0} とする。肝性脳症の傾向がある場合は、タンパク質摂取を制限し、塩分 {1} g/日以下を目標とする。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [
            { correct: "絶食", options: ["絶食", "流動食", "低残渣食", "成分栄養"] },
            { correct: "5", options: ["3", "5", "6", "7"] }
        ]
    },
    {
        text: "薬物療法：C型肝炎ウイルスが原因の肝硬変（代償性肝硬変）に対しては、 {0} 、インターフェロンフリー療法を行う。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "インターフェロン療法", options: ["インターフェロン療法", "ステロイド療法", "血漿交換療法", "免疫抑制療法"] }]
    },
    {
        text: "代償期の食事療法： {0} g/kg/日のタンパク質摂取。 {1} kcal/kg/日のエネルギー摂取。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [
            { correct: "1.2~1.3", options: ["0.8~1.0", "1.0~1.2", "1.2~1.3", "1.5~2.0"] },
            { correct: "25~35", options: ["15~20", "20~25", "25~35", "35~40"] }
        ]
    },
    {
        text: "対症療法 ①腹水： {0} とし 3～5g/日の塩分制限、1L/日の水分制限。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "安静臥床", options: ["安静臥床", "体位変換", "早期離床", "座位保持"] }]
    },
    {
        text: "腹水のアセスメント ②呼吸困難：腹水によって {0} が押し上げられるため呼吸困難となる。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "横隔膜", options: ["横隔膜", "肺尖部", "縦隔", "腹直筋"] }]
    },
    {
        text: "腹壁の緊張を和らげる体位：ファウラー位では上体を挙上し膝を曲げる。膝窩部に枕を入れ、腹部を {0} させる。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "弛緩", options: ["弛緩", "圧迫", "緊張", "伸展"] }]
    },
    {
        text: "ファウラー位では、 {0} が低下する。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "静脈還流量", options: ["静脈還流量", "肺活量", "動脈血酸素分圧", "腹腔内圧"] }]
    },
    {
        text: "治療食を続けることの苦痛を緩和するための援助：塩分 {0} g/日程度に制限 ⇒ おいしく食べることができない。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "5~6", options: ["3~4", "5~6", "7~8", "9~10"] }]
    },
    {
        text: "腹腔穿刺に伴う苦痛を緩和するための援助：一度の穿刺でかなりの腹水を除去すると循環血液量が減少し、 {0} になる恐れがある。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "ショック", options: ["ショック", "心不全", "肺水腫", "高血圧クライシス"] }]
    },
    {
        text: "肝がんの初期症状：病期の進行とともに {0} 、 {1} 、 {2} 、 {3} などを認めるようになる。<span class='citation'>[cite: 6]</span>",
        type: "unordered",
        corrects: ["黄疸", "腹水", "食道静脈瘤", "低血糖発作"],
        options: ["黄疸", "腹水", "食道静脈瘤", "低血糖発作", "肝性脳症", "クモ状血管腫", "消化管出血", "糖尿病", "高アンモニア血症", "羽ばたき振戦"]
    },
    {
        text: "経カテーテル動脈塞栓療法(TAE)の看護：実施後両足背動脈を触診し拍動を確認する。実施後 {0} 時間は安静。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "6", options: ["2", "4", "6", "12"] }]
    },
    {
        text: "肝生検の体位： {0} とし、腹部全体を露出する。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "仰臥位", options: ["仰臥位", "腹臥位", "側臥位", "ファウラー位"] }]
    },
    {
        text: "肝生検の穿刺部位： {0} <span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "第7~9肋間", options: ["第7~9肋間", "第5~6肋間", "第9~11肋間", "剣状突起下"] }]
    },
    {
        text: "肝生検の安静：生検直前と直後は、 {0} とする。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "安静", options: ["安静", "絶飲食", "側臥位", "深呼吸"] }]
    },
    {
        text: "肝生検の止血：生検後、 {0} 時間圧迫止血をし、ベッド上安静とする。<span class='citation'>[cite: 6]</span>",
        type: "ordered",
        holes: [{ correct: "4~6", options: ["1~2", "2~4", "4~6", "6~8"] }]
    }
];

let currentIndex = 0;

function shuffle(array) {
    let newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById("progress").textContent = `問題 ${currentIndex + 1} / ${questions.length}`;
    
    let htmlText = q.text;
    
    if (q.type === "ordered") {
        q.holes.forEach((hole, index) => {
            let selectHtml = `<select id="hole-${index}"><option value="">選択してください</option>`;
            let opts = shuffle(hole.options);
            opts.forEach(opt => {
                selectHtml += `<option value="${opt}">${opt}</option>`;
            });
            selectHtml += `</select>`;
            htmlText = htmlText.replace(`{${index}}`, selectHtml);
        });
    } else if (q.type === "unordered") {
        let opts = shuffle(q.options);
        q.corrects.forEach((correct, index) => {
            let selectHtml = `<select id="hole-${index}"><option value="">選択してください</option>`;
            opts.forEach(opt => {
                selectHtml += `<option value="${opt}">${opt}</option>`;
            });
            selectHtml += `</select>`;
            htmlText = htmlText.replace(`{${index}}`, selectHtml);
        });
    }
    
    document.getElementById("question-text").innerHTML = htmlText;
    
    // Reset UI state
    document.getElementById("result-area").style.display = "none";
    document.getElementById("submit-btn").style.display = "inline-block";
    document.getElementById("next-btn").style.display = "none";
}

function checkAnswer() {
    const q = questions[currentIndex];
    let isCorrect = true;
    let numHoles = q.type === "ordered" ? q.holes.length : q.corrects.length;
    let userAnswers = [];
    
    // Validate that all blanks are filled
    for(let i=0; i<numHoles; i++) {
        let val = document.getElementById(`hole-${i}`).value;
        if(!val) {
            alert("すべての空欄を選択してください。");
            return;
        }
        userAnswers.push(val);
    }
    
    let correctAnswersText = "";

    if (q.type === "ordered") {
        for(let i=0; i<numHoles; i++) {
            if(userAnswers[i] !== q.holes[i].correct) {
                isCorrect = false;
            }
        }
        correctAnswersText = q.holes.map(h => h.correct).join("、");
    } else if (q.type === "unordered") {
        let sortedUser = [...userAnswers].sort();
        let sortedCorrect = [...q.corrects].sort();
        
        let uniqueUserAnswers = new Set(userAnswers);
        if(uniqueUserAnswers.size !== userAnswers.length) {
            isCorrect = false; // 同じ選択肢を複数回選んだ場合は不正解
        } else {
            for(let i=0; i<sortedUser.length; i++) {
                if(sortedUser[i] !== sortedCorrect[i]) {
                    isCorrect = false;
                }
            }
        }
        correctAnswersText = q.corrects.join("、");
    }

    const resultArea = document.getElementById("result-area");
    const resultMessage = document.getElementById("result-message");
    const correctAnswerDiv = document.getElementById("correct-answer");
    
    resultArea.style.display = "block";
    resultArea.className = isCorrect ? "correct" : "incorrect";
    
    if(isCorrect) {
        resultMessage.innerHTML = "<h3>⭕ 正解！</h3>";
        correctAnswerDiv.innerHTML = "";
    } else {
        resultMessage.innerHTML = "<h3>❌ 不正解...</h3>";
        correctAnswerDiv.innerHTML = `正解は <strong>${correctAnswersText}</strong> です。（順不同の場合はいずれかの順で正解が含まれます）`;
    }
    
    document.getElementById("submit-btn").style.display = "none";
    
    if (currentIndex < questions.length - 1) {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("next-btn").textContent = "次の問題へ";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("next-btn").textContent = "最初からやり直す";
    }
    
    // Lock the dropdowns
    for(let i=0; i<numHoles; i++) {
        document.getElementById(`hole-${i}`).disabled = true;
    }
}

function nextQuestion() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
    } else {
        currentIndex = 0; // Restart
    }
    loadQuestion();
}

window.onload = loadQuestion;
</script>
</body>
</html>
