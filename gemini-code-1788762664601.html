    ch: "第6章 (6-17 ～ 6-19)", type: "incorrect",
    options: [
      { text: "精神の障害によりやってよいことと悪いことの判断等が全くできない状態を心神喪失状態という。[cite: 9, 10]", isTarget: false },
      { text: "重大な他害行為を行った者の医療観察法は、裁判官が診査協議会に申し立てて行われる。[cite: 10]", isTarget: true, exp: "6-18の誤り。「検察官」が「地方裁判所」に申し立てます。[cite: 9]" },
      { text: "ギャンブル等依存症対策基本法は、国、地方公共団体等の責務を明らかにするものである。[cite: 9, 10]", isTarget: false }
    ]
  }
];

const container = document.getElementById('quiz-container');

quizData.forEach((q, index) => {
  const block = document.createElement('div');
  block.className = 'question-block';
  
  const title = document.createElement('div');
  title.className = 'chapter-title';
  title.textContent = `問${index + 1}：${q.ch}`;
  block.appendChild(title);

  const qInstruction = document.createElement('div');
  qInstruction.className = 'q-instruction';
  qInstruction.textContent = q.type === 'correct' ? "次の記述のうち、【正しいもの】を1つ選べ。" : "次の記述のうち、【誤っているもの】を1つ選べ。";
  block.appendChild(qInstruction);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  
  let answered = false;

  q.options.forEach((opt, i) => {
    const optDiv = document.createElement('div');
    optDiv.className = 'option';
    optDiv.textContent = `${i + 1}. ${opt.text}`;
    
    optDiv.addEventListener('click', () => {
      if(answered) return;
      answered = true;

      // 正解・不正解のスタイリングを全選択肢に適用
      const allOpts = block.querySelectorAll('.option');
      allOpts.forEach((o, idx) => {
        if(q.options[idx].isTarget) {
          o.classList.add('correct-ans');
        } else {
          o.classList.add('incorrect-ans');
        }
      });

      if(opt.isTarget) {
        feedback.classList.add('success');
        feedback.innerHTML = `<strong>正解！</strong><br>${opt.exp || "この選択肢が正解です。"}`;
      } else {
        feedback.classList.add('error');
        // 不正解の場合はターゲット（正解となる選択肢）の解説を表示
        const targetOpt = q.options.find(o => o.isTarget);
        feedback.innerHTML = `<strong>不正解...</strong><br>正解は選択肢 ${q.options.indexOf(targetOpt) + 1} です。<br>${targetOpt.exp || "この選択肢が正解の対象です。"}`;
      }
      feedback.style.display = 'block';
    });
    block.appendChild(optDiv);
  });
  
  block.appendChild(feedback);
  container.appendChild(block);
});
</script>

</body>
</html>
