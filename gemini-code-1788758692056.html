        { id: "1-11", text: "WHO ( [___] )、FAO( [___] )、ILO ( [___] ) は国連の専門機関である。また開発途上国への国際協力を行う日本の国際協力機構を ( [___] )と略称する。", answers: ["世界保健機関", "国連食糧農業機関", "国際労働機関", "JICA"] },

        { id: "3-14", text: "医療法において院内感染防止については指針の策定、 [___] 、 [___] 、感染症の発生状況の報告体制等の実施を求めている。", answers: ["感染対策委員会の開催", "職員研修"] },
        { id: "3-15", text: "医療機器に関する医療安全対策は、 [___] 、 [___] 、 [___] 、 [___] 、 [___] 、 [___] が規定されている。", answers: ["指針の策定", "医療機器安全管理責任者の配置", "職員研修", "保守点検計画及び実施", "情報の収集", "改善の方策実施"] },
        { id: "3-16", text: "病院等の管理者は、医療事故が発生した場合、厚生労働大臣が指定した [___] に遅滞なく報告しなければならない。", answers: ["医療事故調査・支援センター"] },

        { id: "3-19", text: "病院を開設するときは [___] の許可を得なければならない。ただし病床数を [___] 場合は届け出だけで許可は要しない。", answers: ["都道府県知事", "減らす"] },

        { id: "3-23", text: "病院の管理者は、病院に医師を宿直させなければならない。入院患者の急変に対応するため隣接する病院敷地外に待機している場合 [___] 。", answers: ["は認められる場合がある"] },

        { id: "3-26", text: "医療法には病院の医師数や [___] 、 [___] についても規定している。", answers: ["薬剤師数", "看護師数"] },
        { id: "3-27", text: "看護師の数は一般の病院において、一般病床では患者 [___] に1人、療養病床では患者 [___] に1人として算定し配置しなければならない。", answers: ["3人", "4人"] },
        { id: "3-28", text: "看護師の数は、外来患者 [___] に対し1人置かなければならない。", answers: ["30人"] },

        { id: "3-30", text: "病院等は清潔であり安全でなければならない。医療法等により [___] 、 [___] に関しても基準が定められている。", answers: ["換気", "照明"] },
        { id: "3-31", text: "病院の一般病室は患者1人当たり [___] でなければならない。", answers: ["6.4m²以上"] },
        { id: "3-32", text: "病院の一般病床の廊下は、両側に居室がある場合は [___] 以上、片側だけの場合は [___] 以上必要とされている。", answers: ["2.1m", "1.8m"] },
        { id: "3-33", text: "地階に病室を設置することは [___] 。", answers: ["できない"] },

        { id: "3-40", text: "また広範かつ継続的な医療の提供が必要と認められる5疾病とは [___] 、 [___] 、 [___] 、 [___] 、 [___] をいう。", answers: ["がん", "脳卒中", "急性心筋梗塞", "糖尿病", "精神疾患"] },

        { id: "4-11", text: "薬剤師は、医師等の処方箋によらなければ調剤してはならない。調剤後は [___] に調剤済みであること等を記入し [___] 保存しなければならない。", answers: ["処方箋", "3年間"] },
        { id: "4-12", text: "薬剤師は、交付した医師の署名がある処方箋に疑義があるとき、その通り調剤 [___] 。", answers: ["してはならない"] },
        { id: "4-13", text: "診療放射線技師は、人体に対し放射線を照射したときは、遅滞なく一定の事項を記載した [___] を作成し、 [___] の署名を受けておかなければならない。", answers: ["照射録", "指示した医師等"] },
        { id: "4-14", text: "放射線の照射業務は診療の補助 [___] 、看護師が行うこと [___] 。", answers: ["であるため", "はできない"] },
        { id: "4-15", text: "臨床検査技師は、診療の補助として検査のための検体を採取することが出来る。検査のために肘静脈から採血することは [___] 。", answers: ["できる"] },
        { id: "4-16", text: "都道府県知事の登録を受けた衛生検査所では [___] 、 [___] 等の検査ができる。", answers: ["血液検査", "細菌検査"] },
        { id: "4-17", text: "理学療法士は [___] という。", answers: ["Physical Therapist"] },
        { id: "4-18", text: "身体に障害のある者に対し、主としてその基本的動作能力の回復を図るため、治療体操などの運動を行わせたり電気刺激・マッサージ・温熱などの物理的手段を加えることを業とする者を [___] という。", answers: ["理学療法士"] },
        { id: "4-19", text: "言語聴覚士は診療の補助として [___] をすることができる。", answers: ["嚥下訓練"] },
        { id: "4-20", text: "臨床工学技士は針を穿刺 [___] 採血することができる。", answers: ["せずに"] },
        { id: "4-21", text: "生命維持管理装置の操作や保守点検を行うことを業とする者を [___] という。", answers: ["臨床工学技士"] },
        { id: "4-22", text: "義肢装具士は義肢・装具の製作及び身体への適合を行う。なお装着部位の採型 [___] 。", answers: ["もできる"] },
        { id: "4-23", text: "診療の補助として嚥下訓練や人工内耳の調整等ができる者を [___] という。", answers: ["言語聴覚士"] },
        { id: "4-24", text: "救急救命士は原則的に救急用自動車以外の場所で業務を [___] 。", answers: ["行ってはならない"] },
        { id: "4-25", text: "歯牙露出面及び歯茎の遊離縁下の付着物等を機械的操作によって除去することが出来るのは [___] 、 [___] である。", answers: ["歯科医師", "歯科衛生士"] },
        { id: "4-26", text: "はり師はきゅうを、きゅう師は針の施術をすることが [___] 。", answers: ["できない"] },
        { id: "4-27", text: "心理に関する支援を要する者の心理状態を観察しその結果を分析し、またその者の相談に応じ、助言、指導その他の援助を行うことを業とする者は [___] である。", answers: ["公認心理師"] },
        { id: "4-28", text: "精神障害の医療を受け、又は精神障害者の社会復帰目的の施設の利用者に対し社会復帰に関する相談に応じ、助言、指導、訓練その他の援助を行うことを業とする者は [___] である。", answers: ["精神保健福祉士"] },
        { id: "4-29", text: "管理栄養士は [___] の免許を受け傷病者に対する療養のために必要な栄養の指導等を行う。", answers: ["厚生労働大臣"] },
        { id: "4-30", text: "Social Worker と呼ばれる [___] は身体上または精神上の障害又は環境上の理由により日常生活を営むのに支障がある者の相談に応じ、助言、指導その他保健医療サービス提供者との連絡調整等を行う者である。", answers: ["社会福祉士"] },
        { id: "4-31", text: "介護福祉士は身体上又は精神上の障害のある者に、心身の状況に応じた介護(喀痰の吸引など [___] ) を医師の指示のもとに行う者である。", answers: ["を含む"] },
        { id: "4-32", text: "獣医師は国家試験により [___] の免許を受けなければならない。", answers: ["農林水産大臣"] },
        { id: "4-33", text: "愛玩動物看護師は国家試験に合格し [___] 、 [___] の免許を受けなければならない。", answers: ["農林水産大臣", "環境大臣"] },

        // 第5章
        { id: "5-1", text: "地域における創意工夫を生かしつつ、効率的かつ質の高い医療提供体制を構築するとともに地域包括ケアシステムを構築することを通じ、地域における医療及び介護の総合的な確保を促進することを目的とするのは [___] である。", answers: ["地域における医療及び介護の総合的な確保の促進に関する法律"] },
        { id: "5-2", text: "地域の実情に応じて、高齢者が可能な限り住み慣れた地域で能力に応じ自立した日常生活を営むことが出来るよう、医療・介護・介護予防・住まい及び自立した日常生活の支援が確立される体制を [___] という。", answers: ["地域包括ケアシステム"] },
        { id: "5-3", text: "地域包括支援センターの主な設置主体は [___] で、管理者に職種の規定はないが、 [___] 、 [___] 、 [___] 等が置かれる。", answers: ["市町村等自治体", "保健師又は地域ケアに経験のある看護師", "社会福祉士", "主任ケアマネージャー"] },
        { id: "5-4", text: "地域包括支援センターの主な4つの機能とは [___] 、 [___] 、 [___] 、 [___] である。", answers: ["介護予防マネジメント", "総合相談・支援", "権利擁護事業", "包括的・継続的マネジメント"] },
        { id: "5-5", text: "JCHOとは [___] のことである。またAMEDとは [___] のことである。", answers: ["独立行政法人地域医療機能推進機構", "国立研究開発法人日本医療研究開発機構"] },
        { id: "5-6", text: "臓器の移植に関する法律で規定する臓器は、心臓、肺、肝臓、膵臓、眼球の他、 [___] 、 [___] が規定されている。", answers: ["腎臓", "小腸"] },
        { id: "5-7", text: "臓器移植は15歳未満の者から移植することが [___] 。", answers: ["できる"] },
        { id: "5-8", text: "わが国では、一般に人の死は [___] 、 [___] 、 [___] を基礎として総合的に判定している。", answers: ["呼吸の停止", "脈拍の停止", "瞳孔散大"] },
        { id: "5-9", text: "脳死した者の身体とは、脳幹を含む [___] の機能が [___] に停止するに至ったと判定された者の身体をいう。", answers: ["全脳", "不可逆的"] },
        { id: "5-10", text: "移植に係る脳死判定は [___] 、 [___] 、 [___] 、 [___] 、 [___] 等の確認が必要である。", answers: ["深昏睡", "瞳孔固定4mm以上", "脳幹反射消失", "平坦脳波", "自発呼吸の消失"] },
        { id: "5-11", text: "成人に対するこの脳死判定は [___] の2名の医師の判断の一致によって行われ、通常 [___] を経て2回行わなければならない。", answers: ["臓器の摘出及び移植に関与しない医師", "6時間以上"] },
        { id: "5-12", text: "患者が提供の意思がある旨の書面があるが、遺族が拒む場合、臓器移植は [___] である。また遺族がない場合は [___] である。", answers: ["提供不可", "提供可"] },
        { id: "5-13", text: "患者が提供の意思が不明の場合、遺族が書面で承諾した場合、臓器移植は [___] である。", answers: ["提供可"] },
        { id: "5-14", text: "臓器斡旋機関は [___] の許可を受けなければならない。", answers: ["厚生労働大臣"] },
        { id: "5-15", text: "「移植に用いる造血幹細胞の適切な提供の推進に関する法律」で規定する造血幹細胞は [___] 、 [___] 、 [___] である。", answers: ["骨髄", "末梢血幹細胞", "臍帯血"] },
        { id: "5-16", text: "人工多能性幹細胞(iPS細胞など)を用いる医療技術は [___] である。", answers: ["第1種再生医療等"] },
        { id: "5-17", text: "死産とは妊娠 [___] 以後における死児の出産で、死児とは、出産後において心臓拍動、随意筋の運動及び呼吸の [___] 認めないものをいう。", answers: ["4ヵ月", "いずれをも"] },
        { id: "5-18", text: "死産の届出は医師または助産師の死産証書または死胎検案書を添えて、 [___] 以内に [___] に提出しなければならない。", answers: ["7日", "市町村長もしくは区長"] },
        { id: "5-19", text: "病因の解明のために行う解剖を [___] という。", answers: ["病理解剖"] },
        { id: "5-20", text: "死体の解剖を行う場合、解剖学・病理学・法医学の教授や准教授が行う場合等、一定の場合を除いて、 [___] の許可を受けなければならない。", answers: ["保健所長"] },
        { id: "5-21", text: "都道府県において災害拠点病院について指定する。基本的に、地域災害拠点病院は原則として、 [___] ごとに1か所整備することとしている。", answers: ["2次医療圏"] },
        { id: "5-22", text: "災害医療に関係するDMATとは災害派遣医療チームの事であるがDPATとは [___] の事である。またDHEATとは [___] の事である。", answers: ["災害派遣精神医療チーム", "健康危機管理チーム"] },
        { id: "5-23", text: " [___] が災害拠点病院を指定する。原則として、地域災害拠点病院を [___] ごとに1か所、 [___] を都道府県に1か所指定する。", answers: ["都道府県", "2次医療圏", "基幹災害拠点病院"] },
        { id: "5-24", text: "地域保健法は [___] 、 [___] の設置や運営について規定したものである。", answers: ["保健所", "市町村保健センター"] },
        { id: "5-25", text: "保健所は [___] 、 [___] 、 [___] 等が設置する。", answers: ["都道府県", "指定都市", "特別区"] },
        { id: "5-26", text: "保健所の事業には人口動態統計、食品衛生、感染症の予防対策、 [___] 、 [___] を行う他、地域の地域保健に関する調査研究等を行うことが出来る。", answers: ["精神保健に関する事項", "難病の保健に関する事項"] },
        { id: "5-27", text: " [___] 、 [___] 、 [___] 、 [___] はその業務に関して就業地を管轄する保健所の長の指示を受けたときは、基本的にこれに従わなければならない。", answers: ["保健師", "看護師", "助産師", "歯科衛生士"] },
        { id: "5-28", text: "市町村は、住民の健康相談、保健指導、健康診査などを行う拠点として、 [___] を設置することが出来る。", answers: ["市町村保健センター"] },
        { id: "5-29", text: "健康増進法では [___] 、 [___] 、 [___] 等の施策がある。", answers: ["受動喫煙防止", "特別用途表示食品", "国民健康・栄養調査"] },
        { id: "5-30", text: " [___] 、 [___] は健康増進計画を定める。", answers: ["都道府県", "厚生労働大臣"] },
        { id: "5-31", text: "特定給食施設とは、継続的に1回 [___] 以上又は1日 [___] 以上の食事を供給する施設とされている。", answers: ["100食", "250食"] },
        { id: "5-32", text: "特定かつ [___] に継続的に食事を供給する施設のうち、栄養管理が必要として省令で定める特定給食施設の設置者は [___] に届け出なければならない。", answers: ["多数", "都道府県知事"] },
        { id: "5-33", text: "特定給食施設であって特別の栄養管理が必要なものとして厚生労働省令で定めるところにより都道府県知事が指定するものの設置者は、当該特定給食施設に [___] を置かなければならない。", answers: ["管理栄養士"] },
        { id: "5-34", text: "受動喫煙防止に関する健康増進法の規定により [___] である学校や病院では特定屋外喫煙場所、喫煙関連研究場所以外の場所で喫煙してはならない。", answers: ["第1種施設"] },

        // 第6章
        { id: "6-1", text: "精神保健及び精神障害者福祉に関する法律は、 [___] が昭和25年に制定されてから数回の改正を経て、精神障害者の自立と社会経済活動への参加の促進を図るため、大幅に改正され現在の名称となり、更に種々の改正が進み現在に至っている。", answers: ["精神衛生法"] },
        { id: "6-2", text: " [___] は精神保健の向上と精神障害者の福祉の増進を図るため精神保健福祉センターを設置する。センターでは調査研究、精神障害者保健福祉手帳の交付決定、 [___] 等を行う。", answers: ["都道府県", "精神医療審査会の事務"] },
        { id: "6-3", text: "精神保健指定医は、 [___] が必要な知識及び技能を有すると認める場合指定する。指定後 [___] に厚生労働省令で定める研修を受けなければ更新できない。", answers: ["厚生労働大臣", "5年ごと"] },
        { id: "6-4", text: " [___] 、 [___] の際には、精神保健指定医の診察が必要である。", answers: ["医療保護入院", "応急入院"] },
        { id: "6-5", text: "任意入院の場合、入院者から退院の申し出があった場合は、基本的には退院 [___] 。任意入院患者からの退院の申し出があっても、指定医が入院継続の必要があると認めたときは [___] 以内は退院させないことができる。", answers: ["させなければならない", "72時間"] },
        { id: "6-6", text: "医療保護入院は精神保健指定医の診察の結果入院の必要があると認められるが、本人の同意がなく、 [___] の同意があることにより入院させる場合をいう。", answers: ["家族等"] },
        { id: "6-7", text: " [___] は、 [___] 以上の精神保健指定医の診察の結果、一致した意見として、受診者が精神障害者であり、自傷他害の恐れがあると認めたとき、国・都道府県の精神科病院または指定病院に入院させることが出来るが、これを措置入院という。", answers: ["都道府県知事", "2人"] },
        { id: "6-8", text: "緊急措置入院とは、 [___] が、自傷他害の恐れが著しく急を要する場合、 [___] の精神保健指定医の診察により [___] に限り入院させることが出来るものである。", answers: ["都道府県知事", "1人", "72時間"] },
        { id: "6-9", text: "精神保健指定医が必要と認めた場合、入院患者の隔離、 [___] はできるが、入院患者の代理人である弁護士との面会等の制限はできない。", answers: ["身体拘束"] },
        { id: "6-10", text: "12時間未満の患者の隔離は [___] の判断で出来る。", answers: ["精神保健指定医以外の医師"] },
        { id: "6-11", text: "隔離や身体拘束を行った場合、その [___] 、 [___] 、 [___] を診療録に記載しなければならない。", answers: ["理由", "開始日時", "解除日時"] },
        { id: "6-12", text: "精神障害者であり指定医の診察の結果、直ちに入院が必要な者について、家族の同意があるとき、 [___] は応急入院指定病院に移送することができる。", answers: ["都道府県知事"] },
        { id: "6-13", text: "患者の家族は病院の処遇の改善をもとめるため、都道府県知事に請求することが出来る。これを受け都道府県知事は [___] の審査を求め対応する。", answers: ["精神医療審査会"] },
        { id: "6-14", text: " [___] は必要があるときは [___] 以上の精神保健指定医に診察させ、入院継続の意見が一致しない場合、その精神科病院の [___] に対し、退院を命ずることができる。", answers: ["都道府県知事", "2人", "管理者"] },
        { id: "6-15", text: "措置入院者を入院させている精神科病院の管理者は、 [___] を選任し、その者に退院後の生活環境に関し、措置入院者及びその家族等からの相談に応じさせ、及び必要な情報の提供、助言その他の援助を行わせなければならない。当該相談員は精神保健福祉士や、精神障害者に関する業務の経験のある [___] 等がなることが出来る。", answers: ["退院後生活環境相談員", "看護師(※または社会福祉士。どちらも要件を満たせば就くことができます)"] },
        { id: "6-16", text: "精神障害者は都道府県知事に精神障害者保健福祉手帳の交付を申請することが出来る。交付を受けた場合、 [___] に精神障害の状態について認定を受けなければならない。また手帳の交付により [___] 、 [___] 等を受けることができる。", answers: ["2年ごと", "税金の免除や控除", "公共料金等の割引"] },
        { id: "6-17", text: "精神の障害によりやってよいこととやってはいけないことを判断し、またはやってはいけない行為を抑えることが全くできない状態のことを [___] 状態という。", answers: ["心神喪失"] },
        { id: "6-18", text: "心身喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律は、刑法第39条により刑事責任を問えないと無罪が確定した者に対し、適切な医療を提供する必要があることから [___] が [___] に申し立て、必要な手続きを経て行われる。", answers: ["検察官", "地方裁判所"] },
        { id: "6-19", text: "ギャンブル等依存症対策基本法は、ギャンブル等依存症がギャンブル等依存症である者等及びその家族の日常生活又は社会生活に支障を生じさせるものであり、多重債務、貧困、虐待、自殺、犯罪等の重大な社会問題を生じさせていることに鑑み、ギャンブル等依存症対策に関し、基本理念を定め、及び [___] 、 [___] 等の責務を明らかにするものである。", answers: ["国", "地方公共団体"] }
    ];

            inputCount++;
        }
        
        document.getElementById('question-text').innerHTML = htmlText;
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('check-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        const firstInput = document.getElementById('ans-0');
        if(firstInput) firstInput.focus();
    }

    function checkAnswer() {
        const q = quizData[currentIndex];
        let isAllCorrect = true;
        let feedbackHTML = '';

        for (let i = 0; i < q.answers.length; i++) {
            const inputEl = document.getElementById(`ans-${i}`);
            // ユーザー入力の空白を整形して比較しやすくする
            const userAnswer = inputEl.value.trim().replace(/ /g, ' '); 
            // 正解データ側も不要な補足は一部丸めて比較することも可能ですが、ここでは完全一致で判定します。
            const correctAnswer = q.answers[i];

            if (userAnswer === correctAnswer) {
                inputEl.style.backgroundColor = '#d4edda';
                inputEl.style.borderColor = '#28a745';
            } else {
                isAllCorrect = false;
                inputEl.style.backgroundColor = '#f8d7da';
                inputEl.style.borderColor = '#dc3545';
            }
            inputEl.readOnly = true; 
        }

        const feedbackArea = document.getElementById('feedback-area');
        if (isAllCorrect) {
            feedbackArea.className = 'correct-msg';
            feedbackArea.innerHTML = '<strong>正解です！</strong>';
        } else {
            feedbackArea.className = 'incorrect-msg';
            feedbackArea.innerHTML = '<strong>不正解です。</strong><div class="correct-answer-list">正解：' + q.answers.join(' / ') + '</div>';
        }

        feedbackArea.style.display = 'block';
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('next-btn').focus();
    }

    function loadNextQuestion() {
        currentIndex++;
        if (currentIndex < quizData.length) {
            renderQuestion();
        } else {
            document.getElementById('progress').innerText = '終了';
            document.getElementById('question-text').innerHTML = '<strong>すべての問題が終了しました。お疲れ様でした！</strong>';
            document.querySelector('.controls').style.display = 'none';
            document.getElementById('feedback-area').style.display = 'none';
        }
    }

    window.onload = renderQuestion;
</script>
</body>
</html>
