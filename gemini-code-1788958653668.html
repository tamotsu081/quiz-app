<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>救命救急治療 徹底網羅 穴埋め演習</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --success-color: #27ae60;
            --error-color: #c0392b;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .instruction {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-left: 5px solid #ffeeba;
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            flex-grow: 1;
            background-color: #e9ecef;
            height: 12px;
            border-radius: 6px;
            margin-right: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            background-color: #fceae8;
            padding: 10px 15px;
            border-left: 5px solid var(--secondary-color);
            border-radius: 4px;
            margin-bottom: 25px;
        }

        .question-box {
            font-size: 1.15rem;
            line-height: 2.2;
            margin-bottom: 30px;
            background-color: #fafafa;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .question-box ul {
            margin-top: 0;
            padding-left: 20px;
        }

        .question-box li {
            margin-bottom: 10px;
        }

        .blank-input {
            display: inline-block;
            width: 140px;
            padding: 8px 12px;
            font-size: 1.05rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            margin: 0 4px;
            transition: all 0.3s;
            background-color: #fff;
        }

        .blank-input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
        }

        .blank-input.correct {
            border-color: var(--success-color);
            background-color: #e8f8f0;
            color: #1e7e34;
            font-weight: bold;
        }

        .blank-input.incorrect {
            border-color: var(--error-color);
            background-color: #fdf2f2;
            color: #bd2130;
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: var(--secondary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        .btn-next {
            background-color: var(--success-color);
            margin-top: 20px;
        }

        .btn-next:hover {
            background-color: #219150;
        }

        .feedback-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            display: none;
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ans-list {
            margin-top: 15px;
            padding-left: 0;
            list-style: none;
        }

        .ans-item {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #fff;
            border-radius: 4px;
            border-left: 4px solid #ccc;
            font-size: 1.05rem;
        }

        .ans-item.item-ok { border-left-color: var(--success-color); }
        .ans-item.item-ng { border-left-color: var(--error-color); }

        .status-ok { color: var(--success-color); font-weight: bold; margin-right: 10px; }
        .status-ng { color: var(--error-color); font-weight: bold; margin-right: 10px; }

        .explanation {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            font-size: 1rem;
            color: #444;
            line-height: 1.7;
        }

        #result-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 30px 0;
        }

        .citation {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-left: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>救命救急治療 徹底網羅 穴埋め演習</h1>
    
    <div id="quiz-screen">
        <div class="instruction">
            💡 <strong>ヒント:</strong> 複数の空欄が並んでいる箇所やリストの項目は、<strong>どの順番で解答しても正解</strong>になるよう設計されています。
        </div>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">問題 1 / 16</div>
        </div>

        <div class="section-title" id="section-title"></div>
        
        <div class="question-box" id="question-box">
            <!-- JavaScriptが問題をここに挿入します -->
        </div>

        <button class="btn" id="submit-btn" onclick="checkAnswers()">判定する</button>

        <div class="feedback-box" id="feedback-box">
            <h2 id="feedback-title" style="margin-top:0;"></h2>
            <ul id="ans-details" class="ans-list"></ul>
            <div id="explanation-text" class="explanation"></div>
            <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <div id="result-screen">
        <h2>全問演習完了！</h2>
        <p>資料内の全領域の復習が完了しました。</p>
        <div class="score-display" id="final-score"></div>
        <p id="score-comment" style="font-size: 1.2rem; margin-bottom: 40px;"></p>
        <button class="btn" onclick="location.reload()">最初からやり直す</button>
    </div>
</div>

    let currentQIndex = 0;

    window.onload = function() {
        renderQuestion();
    };

    function renderQuestion() {
        const q = quizData[currentQIndex];
        document.getElementById('section-title').textContent = q.section;
        
        // プログレスバー
        const progressPercent = ((currentQIndex + 1) / quizData.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        document.getElementById('progress-text').textContent = `問題 ${currentQIndex + 1} / ${quizData.length}`;

        // 問題文の生成
        let htmlContent = q.template;
        q.blanks.forEach((blank, idx) => {
            const inputHtml = `<input type="text" class="blank-input" id="input-${idx}" placeholder="${blank.label}" autocomplete="off" data-group="${blank.group || ''}">`;
            htmlContent = htmlContent.replace(`【${idx}】`, inputHtml);
        });

        document.getElementById('question-box').innerHTML = htmlContent;

        // UIリセット
        document.getElementById('submit-btn').style.display = 'block';
        document.getElementById('feedback-box').classList.remove('show');
        document.getElementById('ans-details').innerHTML = '';

        // イベントリスナー
        setTimeout(() => {
            const firstInput = document.getElementById('input-0');
            if (firstInput) firstInput.focus();
        }, 100);

        q.blanks.forEach((_, idx) => {
            const input = document.getElementById(`input-${idx}`);
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const nextInput = document.getElementById(`input-${idx + 1}`);
                        if (nextInput) {
                            nextInput.focus();
                        } else {
                            checkAnswers();
                        }
                    }
                });
            }
        });
    }

    function checkAnswers() {
        const q = quizData[currentQIndex];
        let correctCount = 0;
        const detailsList = document.getElementById('ans-details');
        detailsList.innerHTML = '';

        // グループごとの整理
        const groups = {};
        const independentBlanks = [];

        q.blanks.forEach((blank, idx) => {
            if (blank.group) {
                if (!groups[blank.group]) groups[blank.group] = [];
                groups[blank.group].push({ blank, idx });
            } else {
                independentBlanks.push({ blank, idx });
            }
        });

        // 独立した空欄の判定
        independentBlanks.forEach(item => {
            const inputEl = document.getElementById(`input-${item.idx}`);
            const userVal = inputEl.value.trim().toLowerCase();
            const isCorrect = item.blank.answers.some(ans => ans.toLowerCase() === userVal);
            
            inputEl.disabled = true;

            const li = document.createElement('li');
            li.className = isCorrect ? 'ans-item item-ok' : 'ans-item item-ng';
            
            if (isCorrect) {
                inputEl.classList.add('correct');
                correctCount++;
                li.innerHTML = `<span class="status-ok">✔ 正解</span> (入力: ${userVal || '空欄'})`;
            } else {
                inputEl.classList.add('incorrect');
                li.innerHTML = `<span class="status-ng">✖ 不正解</span> (入力: ${userVal || '空欄'} / 正答例: ${item.blank.answers[0]})`;
            }
            detailsList.appendChild(li);
        });

        // 順不同グループの判定
        for (const groupName in groups) {
            const groupItems = groups[groupName];
            // 判定用に正解のプールを作る (配列の配列)
            let answerPool = groupItems.map(item => item.blank.answers);

            groupItems.forEach(item => {
                const inputEl = document.getElementById(`input-${item.idx}`);
                const userVal = inputEl.value.trim().toLowerCase();
                inputEl.disabled = true;

                let matchedPoolIndex = -1;
                for (let i = 0; i < answerPool.length; i++) {
                    if (answerPool[i] && answerPool[i].some(ans => ans.toLowerCase() === userVal)) {
                        matchedPoolIndex = i;
                        break;
                    }
                }

                const li = document.createElement('li');
                
                if (matchedPoolIndex !== -1) {
                    inputEl.classList.add('correct');
                    correctCount++;
                    answerPool[matchedPoolIndex] = null; // 使った正解をプールから消す
                    li.className = 'ans-item item-ok';
                    li.innerHTML = `<span class="status-ok">✔ 正解 [順不同]</span> (入力: ${userVal})`;
                } else {
                    inputEl.classList.add('incorrect');
                    li.className = 'ans-item item-ng';
                    // プールに残っている最初の正解候補を提示
                    const remainingAns = answerPool.find(arr => arr !== null);
                    const suggestedAns = remainingAns ? remainingAns[0] : groupItems[0].blank.answers[0];
                    li.innerHTML = `<span class="status-ng">✖ 不正解 [順不同]</span> (入力: ${userVal || '空欄'} / 正答例: ${suggestedAns})`;
                }
                detailsList.appendChild(li);
            });
        }

        // 結果表示UI
        document.getElementById('submit-btn').style.display = 'none';
        
        const feedbackTitle = document.getElementById('feedback-title');
        if (correctCount === q.blanks.length) {
            feedbackTitle.textContent = "🎉 全問正解！";
            feedbackTitle.style.color = "var(--success-color)";
        } else {
            feedbackTitle.textContent = `⚠️ ${q.blanks.length}箇所中 ${correctCount}箇所正解`;
            feedbackTitle.style.color = "var(--error-color)";
        }

        document.getElementById('explanation-text').innerHTML = `<strong>【解説・出典】</strong><br>${q.explanation}`;
        document.getElementById('feedback-box').classList.add('show');
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < quizData.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').textContent = `修了！`;
        document.getElementById('score-comment').textContent = "すべての問題の演習が完了しました。講義資料の重要語句の網羅的な復習ができています。";
    }
