<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>救命救急治療 臨床知識○✖ドリル</title>
    <style>
        :root {
            --primary-color: #b91c1c; /* 救急をイメージしたレッド系 */
            --primary-light: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --correct-color: #10b981;
            --incorrect-color: #ef4444;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .progress-bar-container {
            width: 100%;
            background-color: var(--border-color);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-light);
            width: 0%;
            transition: width 0.3s ease;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .question-card {
            background: #f1f5f9;
            border-left: 6px solid var(--primary-light);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .chapter-tag {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.8;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn-choice {
            padding: 18px;
            font-size: 1.4rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-choice:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #fef2f2;
            transform: translateY(-2px);
        }

        .btn-circle { color: var(--correct-color); }
        .btn-cross { color: var(--incorrect-color); }

        .explanation-card {
            display: none;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            animation: fadeIn 0.4s ease;
        }

        .explanation-card.correct {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .explanation-card.incorrect {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .correct-text-box {
            background: white;
            padding: 14px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid var(--primary-light);
            font-weight: bold;
            color: #0f172a;
        }

        .explanation-detail {
            font-size: 0.95rem;
            margin-top: 8px;
            line-height: 1.6;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: var(--primary-light);
        }

        .final-score-card {
            text-align: center;
            padding: 40px 20px;
        }

        .final-score-card h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 16px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-light);
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>救命救急治療 臨床知識○✖ドリル</h1>
        <p>全9章対応｜再読み込みで○/✖判定と順序がシャッフルされます</p>
    </header>

            <div class="progress-bar" id="progress-bar"></div>
        </div>

            <span id="score-counter">正解数: 0</span>
        </div>

        <div class="question-card">
            <span class="chapter-tag" id="chapter-tag">第1章</span>
            <div class="question-text" id="question-text">問題を読み込み中...</div>
        </div>

        <div class="btn-group">
            <button class="btn-choice btn-circle" onclick="submitAnswer(true)">
                <span>⭕ 正しい（○）</span>
            </button>
            <button class="btn-choice btn-cross" onclick="submitAnswer(false)">
                <span>❌ 間違い（✖）</span>
            </button>
        </div>

        <div class="explanation-card" id="explanation-card">
            <div class="result-title" id="result-title"></div>

            <div class="explanation-detail" id="explanation-detail"></div>
        </div>

        <button class="btn-action" id="next-btn" style="display: none;" onclick="nextQuestion()">次の問題へ ➡</button>
    </div>

    <div id="final-score-area" style="display: none;" class="final-score-card">
        <h2>演習終了！</h2>

    </div>
</div>

        incorrectText: "危機的状況下の家族アセスメントモデル（フィンクの危機モデル）の4段階は、1.衝撃(ショック)、2.攻撃的行動、3.受容、4.忘却である[cite: 9]。",
        explanation: "フィンクの危機モデルの正しい4段階は「1.衝撃(ショック) → 2.防衛的退行 → 3.承認 → 4.適応」です[cite: 9]。"

let generatedQuizData = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

// 配列シャッフル関数 (Fisher-Yates)
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// クイズ初期化：問題順序をシャッフルし、各問の「正文/誤文」提示を50%の確率でランダム決定
function initQuiz() {
    const shuffledRaw = shuffleArray(rawQuestionBank);
    generatedQuizData = shuffledRaw.map((q, idx) => {
        const isTrueStatement = Math.random() < 0.5; // 50%の確率で○か✖かをランダム決定
        return {
            id: idx + 1,
            chapter: q.chapter,
            displayText: isTrueStatement ? q.correctText : q.incorrectText,
            isCorrectAnswer: isTrueStatement, 
            correctText: q.correctText,
            explanation: q.explanation
        };
    });

    currentQuestionIndex = 0;
    score = 0;
    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("final-score-area").style.display = "none";
    showQuestion();
}

// 問題表示
function showQuestion() {
    answered = false;
    const q = generatedQuizData[currentQuestionIndex];
    
    document.getElementById("chapter-tag").innerText = q.chapter;
    document.getElementById("question-text").innerText = q.displayText;
    document.getElementById("question-number").innerText = `第 ${currentQuestionIndex + 1} 問 / ${generatedQuizData.length} 問`;
    document.getElementById("score-counter").innerText = `正解数: ${score}`;
    
    // 進捗バー
    const progressPercent = ((currentQuestionIndex) / generatedQuizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    // UIリセット
    document.getElementById("explanation-card").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
    
    const choiceBtns = document.querySelectorAll(".btn-choice");
    choiceBtns.forEach(btn => btn.disabled = false);
}

// 回答処理
function submitAnswer(userChoice) {
    if (answered) return;
    answered = true;

    const q = generatedQuizData[currentQuestionIndex];
    const isUserCorrect = (userChoice === q.isCorrectAnswer);

    const choiceBtns = document.querySelectorAll(".btn-choice");
    choiceBtns.forEach(btn => btn.disabled = true);

    const expCard = document.getElementById("explanation-card");
    const resultTitle = document.getElementById("result-title");
    const correctTextContainer = document.getElementById("correct-text-container");
    const correctTextDiv = document.getElementById("correct-text");
    const expDetail = document.getElementById("explanation-detail");

    expCard.style.display = "block";

    if (isUserCorrect) {
        score++;
        document.getElementById("score-counter").innerText = `正解数: ${score}`;
        expCard.className = "explanation-card correct";
        resultTitle.innerHTML = `⭕ 正解！ <span style="font-size:0.95rem; font-weight:normal;">(${q.isCorrectAnswer ? 'この文章は正しいです' : 'この文章は誤りです'})</span>`;
    } else {
        expCard.className = "explanation-card incorrect";
        resultTitle.innerHTML = `❌ 不正解... <span style="font-size:0.95rem; font-weight:normal;">(${q.isCorrectAnswer ? '正解は「正しい（○）」でした' : '正解は「間違い（✖）」でした'})</span>`;
    }

    if (!q.isCorrectAnswer || !isUserCorrect) {
        correctTextContainer.style.display = "block";
        correctTextDiv.innerText = q.correctText;
    } else {
        correctTextContainer.style.display = "none";
    }

    expDetail.innerText = "💡 解説・臨床ポイント： " + q.explanation;
    document.getElementById("next-btn").style.display = "block";
}

// 次の問題へ
function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < generatedQuizData.length) {
        showQuestion();
    } else {
        showFinalScore();
    }
}

// 最終スコア画面
function showFinalScore() {
    document.getElementById("quiz-area").style.display = "none";
    const finalScoreArea = document.getElementById("final-score-area");
    finalScoreArea.style.display = "block";
    
    const total = generatedQuizData.length;
    document.getElementById("final-score").innerText = `${score} / ${total} 問`;

    const percentage = (score / total) * 100;
    let comment = "";
    if (percentage === 100) {
        comment = "素晴らしい！救命救急治療の知識が完璧に頭に入っています！";
    } else if (percentage >= 80) {
        comment = "合格ラインです！間違えた箇所の【正文】をしっかり見直して完璧を目指しましょう。";
    } else {
        comment = "繰り返し挑戦して、精緻な間違いを見抜ける臨床知識を定着させましょう！";
    }
    document.getElementById("final-comment").innerText = comment;
}

// やり直し
function restartQuiz() {
    initQuiz();
}

window.onload = initQuiz;
</script>
